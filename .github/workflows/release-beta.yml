name: Release beta build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Space Engineers build environment
        uses: ./.github/actions/setup-se-build

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SE-Goose.sln

      - name: Build Goose (Release)
        run: dotnet build Goose/Goose.csproj -c Release --no-restore

      - name: Build Crane (Release)
        run: dotnet build Crane/Crane.csproj -c Release --no-restore

      - name: Compute UTC timestamp
        id: ts
        shell: pwsh
        run: |
          $stamp = [DateTime]::UtcNow.ToString("yyyy-MM-dd_HH-mm-ss")
          "stamp=$stamp"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=beta-$stamp"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Locate built scripts and rename to .txt
        id: scripts
        shell: pwsh
        run: |
          $stagingDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          $scripts = @(
            @{ Name = 'Goose'; SourceDir = 'Goose' },
            @{ Name = 'Crane'; SourceDir = 'Crane' }
          )

          foreach ($s in $scripts) {
            $src = Join-Path $env:APPDATA "SpaceEngineers\IngameScripts\local\$($s.SourceDir)\script.cs"
            if (-not (Test-Path $src)) {
              throw "Expected packaged script not found at: $src"
            }
            $dst = Join-Path $stagingDir "$($s.Name.ToLower())-script.txt"
            Copy-Item -Path $src -Destination $dst -Force
          }

          "dir=$stagingDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ts.outputs.tag }}
          name: ${{ steps.ts.outputs.tag }}
          prerelease: true
          files: |
            ${{ steps.scripts.outputs.dir }}/goose-script.txt
            ${{ steps.scripts.outputs.dir }}/crane-script.txt
          fail_on_unmatched_files: true
