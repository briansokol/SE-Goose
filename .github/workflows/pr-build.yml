name: PR build check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Space Engineers build environment
        uses: ./.github/actions/setup-se-build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SE-Goose.sln

      - name: Build (Release)
        run: dotnet build SE-Goose.sln -c Release --no-restore

      - name: Test
        run: dotnet test Goose.Tests/Goose.Tests.csproj -c Release --no-build --verbosity normal --logger "console;verbosity=detailed"
